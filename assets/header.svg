<svg width="100%" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="headerTitle headerDesc">
  <title id="headerTitle">Bigyan Prasad Joshi - Portfolio Header</title>
  <desc id="headerDesc">Advanced AI and Creative Technology enthusiast portfolio header featuring flowing data streams, rotating AI core, and ambient glowing nodes.</desc>

  <defs>
    <!-- Deep Space Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a" />
      <stop offset="50%" stop-color="#080c17" />
      <stop offset="100%" stop-color="#030612" />
    </linearGradient>

    <!-- Professional Text Gradient (Cyan to White to Violet) -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>

    <linearGradient id="subtitleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Seamless Tech Grid Pattern -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.4"/>
      <!-- Tiny intersection dots -->
      <circle cx="0" cy="0" r="1" fill="#334155" opacity="0.6"/>
    </pattern>

    <!-- Ambient Glowing Orbs -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a2be2" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0" />
    </radialGradient>

    <!-- Vignette for Depth -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <!-- 1. Base Background -->
  <rect width="1000" height="260" fill="url(#bgGradient)"/>

  <!-- 2. Ambient Lighting Pulses -->
  <circle cx="150" cy="130" r="250" fill="url(#glowCyan)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="130" r="250" fill="url(#glowViolet)">
    <animate attributeName="opacity" values="1;0.5;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- 3. Animated Seamless Grid -->
  <g opacity="0.7">
    <rect width="1030" height="290" x="-30" y="-30" fill="url(#gridPattern)">
      <!-- Exact translation to match grid size for a perfect infinite loop -->
      <animateTransform attributeName="transform" type="translate" from="0 0" to="30 30" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 4. Animated Data Streams (Flowing Lines) -->
  <g fill="none" stroke-width="1.5" opacity="0.6">
    <!-- Stream 1 -->
    <path d="M-50,200 C 200,200 300,50 500,50 C 700,50 800,220 1050,220" stroke="#00f0ff" stroke-dasharray="150 400" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="550" to="0" dur="5s" repeatCount="indefinite"/>
    </path>
    <!-- Stream 2 -->
    <path d="M-50,80 C 250,80 350,180 500,180 C 650,180 750,70 1050,70" stroke="#8a2be2" stroke-dasharray="100 500" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="600" to="0" dur="7s" repeatCount="indefinite"/>
    </path>
    <!-- Stream 3 (Subtle background flow) -->
    <path d="M-50,140 Q 450,10 1050,140" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2 10" opacity="0.3">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="10s" repeatCount="indefinite" linear="true"/>
    </path>
  </g>

  <!-- 5. Advanced Abstract "AI Core" (Replacing Mascot) -->
  <g transform="translate(870, 130)">
    <!-- Outer Ring -->
    <circle r="45" fill="none" stroke="#334155" stroke-width="1"/>
    <circle r="45" fill="none" stroke="#8a2be2" stroke-width="2" stroke-dasharray="20 40" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Middle Ring -->
    <circle r="32" fill="none" stroke="#1e293b" stroke-width="1"/>
    <circle r="32" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="15 30" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Inner Ring -->
    <circle r="18" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Core Pulse -->
    <circle r="6" fill="#00f0ff">
      <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Data link extending from core -->
    <line x1="-45" y1="0" x2="-80" y2="0" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2 4" opacity="0.5">
      <animate attributeName="stroke-dashoffset" from="20" to="0" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 6. Abstract Network Nodes (Left Side) -->
  <g transform="translate(130, 130)">
    <circle r="2" fill="#00f0ff"/>
    <circle cx="40" cy="-30" r="2" fill="#8a2be2"/>
    <circle cx="20" cy="40" r="2" fill="#ffffff"/>
    <circle cx="-30" cy="-10" r="2" fill="#00f0ff"/>
    
    <g stroke="#334155" stroke-width="1" opacity="0.6">
      <line x1="0" y1="0" x2="40" y2="-30"/>
      <line x1="0" y1="0" x2="20" y2="40"/>
      <line x1="0" y1="0" x2="-30" y2="-10"/>
      <line x1="40" y1="-30" x2="20" y2="40"/>
    </g>
    
    <!-- Animated pulse through network -->
    <circle r="8" fill="none" stroke="#00f0ff" stroke-width="1">
      <animate attributeName="r" values="0;25" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 7. Ambient Floating Particles -->
  <g>
    <circle cx="20%" cy="30%" r="1.5" fill="#00f0ff" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-15; 0,0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75%" cy="20%" r="2" fill="#8a2be2" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,20; 0,0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="85%" cy="80%" r="1" fill="#ffffff" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0,0; -15,-10; 0,0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="35%" cy="85%" r="2.5" fill="#00f0ff" opacity="0.4">
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,15; 0,0" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 8. Typography (Centered & Professional) -->
  <!-- Name Background Blur / Drop Shadow Simulation -->
  <text x="50%" y="122" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="#000000" opacity="0.5" transform="translate(2, 2)">
    BIGYAN PRASAD JOSHI
  </text>
  
  <!-- Main Name -->
  <text x="50%" y="122" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="url(#textGradient)" letter-spacing="1.5">
    BIGYAN PRASAD JOSHI
  </text>
  
  <!-- Tech Brackets & Subtitle -->
  <text x="50%" y="162" text-anchor="middle" font-family="monospace, Courier New" font-size="16" font-weight="500" letter-spacing="3" fill="#00f0ff" opacity="0.8">
    [ <tspan fill="url(#subtitleGradient)" font-family="system-ui, -apple-system, sans-serif">AI &amp; CREATIVE TECHNOLOGY ENTHUSIAST</tspan> ]
  </text>

  <!-- Animated Cyber Underline -->
  <g transform="translate(0, 182)">
    <rect x="500" y="0" width="0" height="2" fill="url(#textGradient)">
      <animate attributeName="width" values="0;280;280" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="500;360;360" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- Center node on underline -->
    <circle cx="500" cy="1" r="3" fill="#ffffff">
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 9. Depth Overlay (Vignette) -->
  <rect width="1000" height="260" fill="url(#vignette)" style="pointer-events: none;"/>
</svg>