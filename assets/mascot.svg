<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mascotTitle mascotDesc">
  <title id="mascotTitle">Pixel, the curiosity mascot</title>
  <desc id="mascotDesc">An original small futuristic character sitting beside a laptop, surrounded by floating technology sparks, representing curiosity and experimentation</desc>

  <defs>
    <radialGradient id="mascotBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#101a33"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2440"/>
      <stop offset="100%" stop-color="#0e1626"/>
    </linearGradient>
    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="110" cy="110" r="108" fill="url(#mascotBg)"/>

  <!-- floating tech sparks -->
  <g>
    <circle cx="35" cy="55" r="2.5" fill="#a78bfa">
      <animate attributeName="cy" values="55;40;55" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="185" cy="70" r="2" fill="#7dd3fc">
      <animate attributeName="cy" values="70;85;70" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="45" cy="165" r="2.2" fill="#7dd3fc">
      <animate attributeName="cx" values="45;60;45" dur="6s" repeatCount="indefinite"/>
    </circle>
    <path d="M170 150 l4 4 l-4 4 l-4 -4 Z" fill="#a78bfa" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0 170 154" to="360 170 154" dur="9s" repeatCount="indefinite"/>
    </path>
    <text x="150" y="45" font-family="'Courier New', monospace" font-size="12" fill="#3a4a6b">01</text>
    <text x="30" y="130" font-family="'Courier New', monospace" font-size="12" fill="#3a4a6b">{}</text>
  </g>

  <!-- laptop -->
  <g transform="translate(118, 128)">
    <rect x="0" y="34" width="70" height="7" rx="2" fill="#1c2740"/>
    <rect x="6" y="6" width="58" height="30" rx="2" fill="#111a30" stroke="#3a4a6b" stroke-width="1.2"/>
    <rect x="10" y="10" width="50" height="22" rx="1" fill="#0a1020"/>
    <!-- code lines glowing on the screen -->
    <rect x="14" y="14" width="24" height="2.5" fill="#7dd3fc" opacity="0.85">
      <animate attributeName="width" values="24;34;24" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="14" y="19" width="18" height="2.5" fill="#a78bfa" opacity="0.75"/>
    <rect x="14" y="24" width="30" height="2.5" fill="#7dd3fc" opacity="0.6">
      <animate attributeName="width" values="30;16;30" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- character body -->
  <g transform="translate(78, 96)">
    <!-- antenna -->
    <line x1="0" y1="-4" x2="0" y2="-16" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="0" cy="-19" r="4" fill="url(#glowSoft)"/>
    <circle cx="0" cy="-19" r="2.4" fill="#a78bfa">
      <animate attributeName="cy" values="-19;-23;-19" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- head -->
    <circle cx="0" cy="6" r="18" fill="url(#bodyGradient)" stroke="#7dd3fc" stroke-width="1.6"/>
    <!-- visor / eyes -->
    <rect x="-11" y="1" width="22" height="9" rx="4.5" fill="#05070d"/>
    <circle cx="-5" cy="5.5" r="2.1" fill="#7dd3fc">
      <animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="5" cy="5.5" r="2.1" fill="#7dd3fc">
      <animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <!-- body -->
    <path d="M-14 22 Q0 10 14 22 L16 52 Q0 60 -16 52 Z" fill="url(#bodyGradient)" stroke="#3a4a6b" stroke-width="1.2"/>

    <!-- arm reaching toward laptop -->
    <path d="M13 30 Q30 34 38 30" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round">
      <animate attributeName="d" values="M13 30 Q30 34 38 30;M13 30 Q30 30 38 26;M13 30 Q30 34 38 30" dur="4s" repeatCount="indefinite"/>
    </path>

    <!-- opposite arm resting -->
    <path d="M-13 30 Q-24 40 -18 50" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>

    <!-- legs, sitting -->
    <path d="M-10 52 Q-8 62 2 62" fill="none" stroke="#3a4a6b" stroke-width="4" stroke-linecap="round"/>
    <path d="M10 52 Q14 62 24 60" fill="none" stroke="#3a4a6b" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>